name: CICD
on: 
  workflow_dispatch: 
    inputs:
      environment:
        description: This is the environment value where this workflow runs
        default: "dev"
        required: true
        type: choice
        options:
          - dev
          - prod
          - stagging

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "Code Clone from GitHub"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build the container
        run: echo "Building the code"

  test:
    needs: [code,build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing the code"

  deployment:
    needs: [code, build, test] 
    runs-on: ubuntu-latest
    steps:
      - name: Deployment the application
        run: echo "Deploying the apps"
      
